# Curated skill-pack registry — consumed by the instance template's scripts/packs.sh
# and by bootstrap-instance's pack-selection step. Contract + curation bar in
# systems/packs.md. Keep entries flat and grep-parsable (name → fields, two-space
# indents): the mount script reads this without a YAML library.
version: 1

packs:
  agile:
    repo: https://github.com/meta-agentic/meta-discipline-agile
    ref: main
    description: "Scrum harness for an agentic estate: agile-process (backlog/Jira mirror, ceremonies) and agile-swarm (multi-lane sprint execution). First-party, extracted from the framework core."
    provenance: first-party
    license: MIT
    status: available

  superpowers:
    repo: https://github.com/obra/superpowers
    ref: main
    description: "Well-known third-party Claude Code skill collection (TDD, debugging, planning discipline, and more)."
    provenance: third-party
    license: verify-at-add   # check upstream LICENSE when mounting
    status: available

  anthropic-skills:
    repo: https://github.com/anthropics/skills
    ref: main
    description: "Anthropic's official skill repository — document skills (docx/pdf/pptx/xlsx) and more, in standard SKILL.md folders."
    provenance: third-party   # official upstream: Anthropic
    license: verify-at-add
    status: available

  mattpocock:
    repo: https://github.com/mattpocock/skills
    ref: main
    description: "Matt Pocock's engineering & productivity skills (tdd, code-review, codebase-design, domain-modeling, diagnosing-bugs, research, …). Category-nested; ships .claude-plugin/plugin.json — 21 skills, deprecated/personal excluded by the author."
    provenance: third-party
    license: MIT   # verified: LICENSE — MIT, Matt Pocock
    status: available

  claude-flow:
    repo: https://github.com/ruvnet/claude-flow
    ref: main
    description: "Ruflo / claude-flow — the swarm-orchestration ecosystem most of this framework's original skill library came from (see PROVENANCE.md: agentdb-*, v3-*, flow-nexus-*, github-*, sparc/swarm/reasoningbank sets)."
    provenance: third-party
    license: MIT
    status: planned   # becomes the mount that REPLACES the vendored copies once the
                      # de-vendor story lands; upstream skill layout to verify (the
                      # copies were installed via the claude-flow ecosystem, so the
                      # pack may end up an attributed mirror pinned at upstream)

  advanced-math:
    repo: https://github.com/meta-agentic/meta-discipline-math
    ref: main
    description: "Advanced-mathematics discipline (12 skills): a rigor spine (mathematical-rigor, dimensional-analysis, hypercomplex-and-geometric-algebra) plus per-branch disciplines — calculus-and-analysis, linear-algebra, probability-and-statistics, number-theory, discrete-mathematics, differential-equations, abstract-algebra, complex-analysis, geometry-and-trigonometry — each emitting a checkable ledger. First-party; the quantitative-rigor wedge from pack-strategy."
    provenance: first-party
    license: MIT
    provides: [dimensional-analysis, mathematical-rigor]
    status: available

  physics:
    repo: https://github.com/meta-agentic/meta-discipline-physics
    ref: main
    description: "Physics discipline (16 skills): a method spine (symmetry & conservation, limiting cases, order-of-magnitude, model-building, experimental error), branch disciplines (classical mechanics, electromagnetism, waves, quantum, statistical mechanics & thermodynamics, relativity), and a high-energy tier (QFT, particle physics & the Standard Model, relativistic kinematics, accelerator physics, cosmology) — each emitting a checkable ledger. First-party."
    provenance: first-party
    license: MIT
    depends: [advanced-math]   # consumes dimensional-analysis rather than duplicating it;
                               # under the `pure` profile also mathematical-rigor
    status: available

  software-engineering:
    repo: https://github.com/meta-agentic/meta-discipline-swe
    ref: main
    description: "Software-engineering discipline as judgment, not process. Ships constrained-generation (make LLM generation reliable by restricting what may be emitted — DSL/schema/typed API — behind a four-condition gate whose default answer is no, plus a validator-closed repair loop); design principles applied in review context (SOLID/GRASP, composition), ADR discipline and design reviews follow. First-party."
    provenance: first-party
    license: MIT
    status: available # main carries constrained-generation; more skills follow.
                      # Note: every skill in this pack is opt-in — mounting enables
                      # nothing, each switch defaults to `off` in the pack's pack.yaml
                      # until the instance sets it in .packs.yaml.

# Candidates awaiting verification before entering the curated list (community
# suggestions; upstream owner/repo, license, and mountable-skill layout must be
# confirmed first — the curation bar in systems/packs.md applies):
#   everything-claude-code (agent harness), gstack (role-based orchestration),
#   open-design (UI prototyping toolkit), claude-mem (persistent memory),
#   andrej-karpathy-skills (behavioral guidelines),
#   jeffallan/claude-skills, alirezarezvani/claude-skills (community skill hubs,
#     surfaced via the Snyk "top Claude skills" roundup — verify license/layout).
# Capability themes from that roundup (TDD, systematic debugging, frontend design
# control, context management, dependency management) are skill *concepts*, not repos:
# tdd + diagnosing-bugs come from the mattpocock pack, others inform the software-
# engineering pack's scope rather than being registry entries.
# Directories/utilities that are NOT packs (see "Not packs" in systems/packs.md):
#   awesome-claude-skills, awesome-agent-skills, anthropics/claude-cookbooks,
#   modelcontextprotocol/servers, ccusage.
